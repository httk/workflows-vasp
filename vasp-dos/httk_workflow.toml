[workflow]
name = "vasp.dos"
description = "the electronic density of states and band gaps of one structure: a self-consistent run (or a given charge density), then a non-self-consistent run on a dense uniform mesh, from editable INCAR templates"
declaration_uri = "https://raw.githubusercontent.com/httk/workflows-vasp/refs/tags/wf-decl-v0.3.0/vasp-dos/declaration.json"
declaration_file = "declaration.json"
requires = ["httk-workflow>=2.1.1", "httk-workflow-vasp>=0.1.0", "httk-atomistic>=2.1.2", "httk-analyse>=2.1.0"]

[workflow.runner]
entry = "run.py"
steps = ["analyse", "prepare", "publish", "run_nscf", "run_scf", "stage_nscf", "stage_scf"]
initial_step = "prepare"

[workflow.inputs.structure]
destination = "POSCAR"
role = "initial_structure"
entry_type = "structures"
required = true

[workflow.outputs.total_energy]
entry_type = "records"
role = "total_energy"
ref = "https://schemas.httk.org/defs/v0.1/properties/core/total_energy"
description = "The total energy of the self-consistent run when this job ran it."
product_of = "initial_structure"

[workflow.outputs.electronic_density_of_states]
entry_type = "records"
role = "electronic_density_of_states"
ref = "https://schemas.httk.org/defs/v0.1/properties/electronic/electronic_density_of_states"
description = "The total electronic density of states of the non-self-consistent run."
product_of = "initial_structure"

[workflow.outputs.fermi_energy]
entry_type = "records"
role = "fermi_energy"
ref = "https://schemas.httk.org/defs/v0.1/properties/electronic/fermi_energy"
description = "The Fermi energy of the non-self-consistent run."
product_of = "initial_structure"

[workflow.outputs.band_gap]
entry_type = "records"
role = "band_gap"
ref = "https://schemas.httk.org/defs/v0.1/properties/electronic/band_gap"
description = "The band gap on the uniform mesh (0 for a metal)."
product_of = "initial_structure"

[workflow.outputs.direct_band_gap]
entry_type = "records"
role = "direct_band_gap"
ref = "https://schemas.httk.org/defs/v0.1/properties/electronic/direct_band_gap"
description = "The smallest spin-conserving direct band gap on the uniform mesh (0 for a metal)."
product_of = "initial_structure"

[workflow.outputs.dos]
entry_type = "files"
role = "dos"
description = "DOSCAR of the non-self-consistent run."
product_of = "initial_structure"

[workflow.outputs.eigenvalues]
entry_type = "files"
role = "eigenvalues"
description = "EIGENVAL of the non-self-consistent run on the uniform mesh."
product_of = "initial_structure"

[workflow.outputs.band_edges]
entry_type = "files"
role = "band_edges"
description = "band_edges.json: the band edges, gaps and Fermi energy (per spin channel when spin-polarized)."
product_of = "initial_structure"

[workflow.collect]
file = "collect.py"
