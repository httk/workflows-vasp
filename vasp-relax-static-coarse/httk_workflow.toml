[workflow]
name = "vasp.relax-static-coarse"
description = "relax on a coarse k-point mesh with a Python BFGS driving single points, then one final-mesh static, correcting the coarse surface by the measured offset once"
declaration_uri = "https://raw.githubusercontent.com/httk/workflows-vasp/refs/tags/wf-decl-v0.2.0/vasp-relax-static-coarse/declaration.json"
declaration_file = "declaration.json"
requires = ["httk-workflow>=2.1.1", "httk-workflow-vasp>=0.1.0", "httk-atomistic>=2.1.2"]

[workflow.runner]
entry = "run.py"
steps = ["publish", "prepare", "evaluate"]
initial_step = "prepare"

[workflow.inputs.structure]
destination = "POSCAR"
role = "initial_structure"
entry_type = "structures"
required = true

[workflow.outputs.relaxed_structure]
entry_type = "structures"
role = "relaxed_structure"
ref = "https://schemas.optimade.org/defs/v1.3/entrytypes/optimade/structures"
description = "The geometry of the final-mesh static: where the coarse-mesh relaxation ended, given only when that static is within the force and stress limits."
product_of = "initial_structure"

[workflow.outputs.total_energy]
entry_type = "records"
role = "total_energy"
ref = "https://schemas.httk.org/defs/v0.1/properties/core/total_energy"
description = "The total energy of the relaxed structure from the final-mesh static calculation, given only when that static is within the force and stress limits."
product_of = "relaxed_structure"

[workflow.collect]
file = "collect.py"
