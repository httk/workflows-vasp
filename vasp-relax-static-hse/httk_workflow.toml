[workflow]
name = "vasp.relax-static-hse"
description = "relax with HSE from a PBE-relaxed start: call vasp.relax-static-coarse once with PBE (unless a PBE-relaxed structure is given) and once with HSE from its result, seeding the HSE stage with the PBE WAVECARs, meshes and optionally its BFGS Hessian"
declaration_uri = "https://raw.githubusercontent.com/httk/workflows-vasp/refs/tags/wf-decl-v0.2.0/vasp-relax-static-hse/declaration.json"
declaration_file = "declaration.json"
requires = ["httk-workflow>=2.1.1", "httk-workflow-vasp>=0.1.0", "httk-atomistic>=2.1.2"]

[workflow.runner]
entry = "run.py"
steps = ["start", "after_pbe", "after_hse", "triage"]
initial_step = "start"

[workflow.calls]
coarse = "vasp.relax-static-coarse"

[workflow.inputs.structure]
destination = "POSCAR"
role = "initial_structure"
entry_type = "structures"
required = true

[workflow.outputs.relaxed_structure]
entry_type = "structures"
role = "relaxed_structure"
ref = "https://schemas.optimade.org/defs/v1.3/entrytypes/optimade/structures"
description = "The geometry of the HSE final-mesh static: where the HSE coarse-mesh relaxation ended."
product_of = "initial_structure"

[workflow.outputs.total_energy]
entry_type = "records"
role = "total_energy"
ref = "https://schemas.httk.org/defs/v0.1/properties/core/total_energy"
description = "The HSE total energy of the relaxed structure from the HSE final-mesh static calculation."
product_of = "relaxed_structure"

[workflow.collect]
file = "collect.py"
