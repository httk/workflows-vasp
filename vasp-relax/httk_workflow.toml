[workflow]
name = "vasp.relax"
description = "relax one structure in v1's robust stages, from editable INCAR templates, with the reviewed remedy ladder"
declaration_uri = "https://raw.githubusercontent.com/httk/workflows-vasp/refs/tags/wf-decl-v0.1.0/vasp-relax/declaration.json"
declaration_file = "declaration.json"
requires = ["httk-workflow>=2.1.1", "httk-workflow-vasp>=0.1.0", "httk-atomistic>=2.1.2"]
settings = ["vasp.command", "vasp.pseudo_library"]

[workflow.runner]
entry = "run.py"
steps = ["publish", "prepare", "run", "stage"]
initial_step = "prepare"

[workflow.inputs.structure]
destination = "POSCAR"
role = "initial_structure"
entry_type = "structures"
required = true

[workflow.outputs.relaxed_structure]
entry_type = "structures"
role = "relaxed_structure"
ref = "https://schemas.optimade.org/defs/v1.3/entrytypes/optimade/structures"
description = "The relaxed geometry."
product_of = "initial_structure"

[workflow.outputs.total_energy]
entry_type = "records"
role = "total_energy"
ref = "https://schemas.httk.org/defs/v0.1/properties/core/total_energy"
description = "The final total energy of the relaxed structure."
product_of = "relaxed_structure"

[workflow.collect]
file = "collect.py"

[workflow.postprocess.relaxation-report]
file = "scripts/relaxation_report"
description = "write a relaxation summary (text + JSON) into the job's postprocess directory"
outputs = ["relaxation_report.json", "relaxation_report.txt"]

[workflow.postprocess.relaxation-plot]
file = "scripts/relaxation_plot"
description = "plot ionic-step energies into the job's postprocess directory"
outputs = ["*.svg"]
